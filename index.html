<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15803d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Verwaltung von Mannschaften, Sportplätzen, Hallen, Sportheim und Vereinskalender">
  <title>Sportverein</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/">
      <span class="brand-logo" aria-hidden="true">🏅</span>
      <span class="brand-name" id="clubName">Sportverein</span>
    </a>
    <div class="header-actions">
      <button class="icon-btn" data-action="newEvent" aria-label="Neue Buchung">＋</button>
      <a class="icon-btn" href="#/einstellungen" aria-label="Einstellungen">⚙️</a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a href="#/" data-nav="start"><span aria-hidden="true">🏠</span>Start</a>
    <a href="#/kalender" data-nav="kalender"><span aria-hidden="true">📅</span>Kalender</a>
    <a href="#/belegung" data-nav="belegung"><span aria-hidden="true">🔄</span>Belegung</a>
    <a href="#/teams" data-nav="teams"><span aria-hidden="true">👥</span>Teams</a>
    <a href="#/anlagen" data-nav="anlagen"><span aria-hidden="true">🏟️</span>Anlagen</a>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn" data-action="closeSheet" aria-label="Schließen">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
